<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AutomataLab — an interactive Table-Filling method simulator for DFA minimization with step-by-step visualization, graph input, and verified practice challenges."
    />
    <meta name="theme-color" content="#4f46e5" />
    <title>AutomataLab · DFA Minimization Simulator</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      (function () {
        try {
          var stored = localStorage.getItem('automatalab-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored ? stored === 'dark' : prefersDark
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          /* theme defaults to light when storage is unavailable */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
